<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CHECKMATE: BULLET HELL — AM76 Gamestudio</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #07070a;
      color: #f0f0f5;
      font-family: monospace, system-ui, -apple-system, sans-serif;
    }
    #viewport-container {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #050508;
    }
    canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      cursor: none;
      outline: none;
      box-shadow: 0 12px 48px rgba(0, 0, 0, 0.85);
    }
  </style>
</head>
<body>
  <div id="viewport-container">
    <canvas id="gameCanvas" tabindex="0" aria-label="Checkmate Bullet Hell Arena"></canvas>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
